<text x="60" y="112" class="t-serif" font-size="26" fill="#1a1a1a">node2vec: del grafo al espacio vectorial</text>
<text x="60" y="138" class="t-sans" font-size="13" fill="#6b7280">Caminatas aleatorias sesgadas + SkipGram → representación de nodos en ℝᵈ</text>

