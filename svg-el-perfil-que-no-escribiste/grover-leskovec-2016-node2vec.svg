<text x="60" y="620" class="t-sans" font-size="12" fill="#3d4248">
  La caminata controla por dos parámetros:
</text>
<text x="60" y="640" class="t-mono" font-size="11.5" fill="#1a1a1a">
  p · probabilidad de retorno (búsqueda BFS)
</text>
<text x="60" y="658" class="t-mono" font-size="11.5" fill="#1a1a1a">
  q · probabilidad de salida (búsqueda DFS)
</text>
<text x="60" y="678" class="t-sans" font-size="11.5" fill="#6b7280" font-style="italic">
  Permite balancear homofilia y equivalencia estructural.
</text>


