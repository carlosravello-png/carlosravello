<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" role="img">
<title>node2vec: del grafo al espacio vectorial (Grover y Leskovec, 2016) / node2vec: from graph to vector space (Grover and Leskovec, 2016)</title>
<desc>Diagram of the node2vec framework developed by Aditya Grover and Jure Leskovec in 2016 (Proceedings of the 22nd ACM SIGKDD International Conference on Knowledge Discovery and Data Mining, pp. 855-864, doi:10.1145/2939672.2939754). The algorithm generates low-dimensional vector representations of graph nodes by performing biased random walks (controlled by parameters p and q) and optimizing a SkipGram-style objective. Nodes with similar contextual neighbourhoods are mapped to nearby positions in the embedding space, preserving both homophily and structural equivalence. Diagram by Carlos Eduardo Ravello Joo.</desc>


<rect width="1280" height="800" fill="#ffffff"></rect>

<text x="60" y="62" class="t-mono" font-size="11" letter-spacing="2" fill="#c0824a">FIG. · GROVER &amp; LESKOVEC (2016)</text>
