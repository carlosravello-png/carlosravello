<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" role="img">
<title>Pipeline de reconocimiento biométrico de iris / Iris recognition biometric pipeline</title>
<desc>Diagram of the iris recognition biometric pipeline as formalized by John Daugman (2004, IEEE Trans. Circuits Syst. Video Technol. 14(1): 21-30) and reviewed by Bhatt, Bhatt &amp; Bhatt (2025, Egyptian Journal of Forensic Sciences 15, 12, doi:10.1186/s41935-025-00431-7). The five stages are: (1) acquisition with near-infrared illumination, (2) segmentation via integro-differential operator, (3) normalization via Daugman&#39;s rubber-sheet model, (4) feature extraction using 2D Gabor wavelets producing a 2048-bit IrisCode, and (5) matching via Hamming distance with false acceptance rate of ~10⁻⁶. Diagram by Carlos Eduardo Ravello Joo.</desc>


<rect width="1280" height="800" fill="#ffffff"></rect>

<text x="60" y="62" class="t-mono" font-size="11" letter-spacing="2" fill="#c0824a">FIG. · IRIS BIOMETRIC PIPELINE</text>
<line x1="60" y1="74" x2="1220" y2="74" stroke="#d4d6da" stroke-width="1"></line>
<text x="60" y="112" class="t-serif" font-size="26" fill="#1a1a1a">Pipeline de reconocimiento biométrico de iris</text>
<text x="60" y="138" class="t-sans" font-size="13" fill="#6b7280">De la imagen del ojo al iriscode: las cinco etapas del paradigma de Daugman</text>

<defs>
  <marker id="iris-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#3d4248"></path>
  </marker>
</defs>





<g transform="translate(60,200)">
  <rect x="0" y="0" width="200" height="240" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="14" y="26" class="t-mono" font-size="10" letter-spacing="1.5" fill="#c0824a">1 · ADQUISICIÓN</text>
  
  <ellipse cx="100" cy="110" rx="68" ry="36" fill="#f8f5ef" stroke="#1a1a1a" stroke-width="1.4"></ellipse>
  <circle cx="100" cy="110" r="28" fill="#a8c2d8" stroke="#1a1a1a" stroke-width="1.2"></circle>
  <circle cx="100" cy="110" r="11" fill="#1a1a1a"></circle>
  
  <circle cx="94" cy="104" r="3" fill="#ffffff"></circle>
  
  <line x1="30" y1="75" x2="60" y2="100" stroke="#c0824a" stroke-width="1.2" stroke-dasharray="3 3"></line>
  <text x="22" y="68" class="t-mono" font-size="9" fill="#c0824a">IR</text>

  <text x="100" y="180" class="t-sans" font-size="11" text-anchor="middle" fill="#3d4248" font-weight="600">Imagen del ojo</text>
  <text x="100" y="198" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">cámara monocromática</text>
  <text x="100" y="212" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">con iluminación NIR</text>
  <text x="100" y="226" class="t-mono" font-size="10" text-anchor="middle" fill="#9ca3af">700–900 nm</text>
</g>


<g transform="translate(290,200)">
  <rect x="0" y="0" width="200" height="240" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="14" y="26" class="t-mono" font-size="10" letter-spacing="1.5" fill="#c0824a">2 · SEGMENTACIÓN</text>
  
  <ellipse cx="100" cy="110" rx="68" ry="36" fill="#f8f5ef" stroke="#1a1a1a" stroke-width="1"></ellipse>
  <circle cx="100" cy="110" r="28" fill="#a8c2d8" stroke="#c0824a" stroke-width="2.4" stroke-dasharray="4 2"></circle>
  <circle cx="100" cy="110" r="11" fill="#1a1a1a" stroke="#c0824a" stroke-width="2.4" stroke-dasharray="3 1.5"></circle>
  
  <path d="M 35,90 Q 100,68 165,90" fill="none" stroke="#c0824a" stroke-width="1.4" stroke-dasharray="3 2"></path>
  <path d="M 35,130 Q 100,152 165,130" fill="none" stroke="#c0824a" stroke-width="1.4" stroke-dasharray="3 2"></path>

  <text x="100" y="180" class="t-sans" font-size="11" text-anchor="middle" fill="#3d4248" font-weight="600">Localización iris</text>
  <text x="100" y="198" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">operador integro-</text>
  <text x="100" y="212" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">diferencial; máscara</text>
  <text x="100" y="226" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">de párpados/pestañas</text>
</g>


<g transform="translate(520,200)">
  <rect x="0" y="0" width="200" height="240" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="14" y="26" class="t-mono" font-size="10" letter-spacing="1.5" fill="#c0824a">3 · NORMALIZACIÓN</text>
  
  
  <g transform="translate(50,80)">
    <circle cx="0" cy="40" r="34" fill="none" stroke="#1a1a1a" stroke-width="1"></circle>
    <circle cx="0" cy="40" r="14" fill="none" stroke="#1a1a1a" stroke-width="1"></circle>
    <line x1="14" y1="40" x2="34" y2="40" stroke="#c0824a" stroke-width="1.2"></line>
    <line x1="0" y1="26" x2="0" y2="6" stroke="#c0824a" stroke-width="1.2"></line>
    <line x1="-14" y1="40" x2="-34" y2="40" stroke="#c0824a" stroke-width="1.2"></line>
    <line x1="0" y1="54" x2="0" y2="74" stroke="#c0824a" stroke-width="1.2"></line>
    <text x="0" y="-2" class="t-mono" font-size="9" text-anchor="middle" fill="#6b7280">(r, θ)</text>
  </g>
  
  <line x1="98" y1="120" x2="118" y2="120" stroke="#3d4248" stroke-width="1.2" marker-end="url(#iris-arr)"></line>
  
  <g transform="translate(125,90)">
    <rect x="0" y="0" width="60" height="60" fill="#a8c2d8" stroke="#1a1a1a" stroke-width="1"></rect>
    <line x1="0" y1="15" x2="60" y2="15" stroke="#ffffff" stroke-width="0.6"></line>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#ffffff" stroke-width="0.6"></line>
    <line x1="0" y1="45" x2="60" y2="45" stroke="#ffffff" stroke-width="0.6"></line>
    <line x1="15" y1="0" x2="15" y2="60" stroke="#ffffff" stroke-width="0.6"></line>
    <line x1="30" y1="0" x2="30" y2="60" stroke="#ffffff" stroke-width="0.6"></line>
    <line x1="45" y1="0" x2="45" y2="60" stroke="#ffffff" stroke-width="0.6"></line>
    <text x="30" y="-6" class="t-mono" font-size="9" text-anchor="middle" fill="#6b7280">(x, y)</text>
  </g>

  <text x="100" y="180" class="t-sans" font-size="11" text-anchor="middle" fill="#3d4248" font-weight="600">Rubber-sheet</text>
  <text x="100" y="198" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">coordenadas polares</text>
  <text x="100" y="212" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">→ matriz rectangular</text>
  <text x="100" y="226" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">invariante a dilatación</text>
</g>


<g transform="translate(750,200)">
  <rect x="0" y="0" width="200" height="240" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="14" y="26" class="t-mono" font-size="10" letter-spacing="1.5" fill="#c0824a">4 · CARACTERÍSTICAS</text>
  
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="140" height="70" fill="#f8f5ef" stroke="#1a1a1a" stroke-width="1"></rect>
    
    <g fill="#1a1a1a">
      <rect x="2" y="2" width="9" height="7"></rect>
      <rect x="22" y="2" width="9" height="7"></rect>
      <rect x="32" y="2" width="9" height="7"></rect>
      <rect x="62" y="2" width="9" height="7"></rect>
      <rect x="82" y="2" width="9" height="7"></rect>
      <rect x="102" y="2" width="9" height="7"></rect>
      <rect x="122" y="2" width="9" height="7"></rect>
      <rect x="12" y="11" width="9" height="7"></rect>
      <rect x="42" y="11" width="9" height="7"></rect>
      <rect x="52" y="11" width="9" height="7"></rect>
      <rect x="72" y="11" width="9" height="7"></rect>
      <rect x="92" y="11" width="9" height="7"></rect>
      <rect x="112" y="11" width="9" height="7"></rect>
      <rect x="2" y="20" width="9" height="7"></rect>
      <rect x="32" y="20" width="9" height="7"></rect>
      <rect x="52" y="20" width="9" height="7"></rect>
      <rect x="82" y="20" width="9" height="7"></rect>
      <rect x="102" y="20" width="9" height="7"></rect>
      <rect x="122" y="20" width="9" height="7"></rect>
      <rect x="12" y="29" width="9" height="7"></rect>
      <rect x="22" y="29" width="9" height="7"></rect>
      <rect x="42" y="29" width="9" height="7"></rect>
      <rect x="72" y="29" width="9" height="7"></rect>
      <rect x="92" y="29" width="9" height="7"></rect>
      <rect x="112" y="29" width="9" height="7"></rect>
      <rect x="2" y="38" width="9" height="7"></rect>
      <rect x="32" y="38" width="9" height="7"></rect>
      <rect x="52" y="38" width="9" height="7"></rect>
      <rect x="62" y="38" width="9" height="7"></rect>
      <rect x="82" y="38" width="9" height="7"></rect>
      <rect x="122" y="38" width="9" height="7"></rect>
      <rect x="12" y="47" width="9" height="7"></rect>
      <rect x="22" y="47" width="9" height="7"></rect>
      <rect x="42" y="47" width="9" height="7"></rect>
      <rect x="92" y="47" width="9" height="7"></rect>
      <rect x="112" y="47" width="9" height="7"></rect>
      <rect x="2" y="56" width="9" height="7"></rect>
      <rect x="22" y="56" width="9" height="7"></rect>
      <rect x="32" y="56" width="9" height="7"></rect>
      <rect x="52" y="56" width="9" height="7"></rect>
      <rect x="72" y="56" width="9" height="7"></rect>
      <rect x="82" y="56" width="9" height="7"></rect>
      <rect x="102" y="56" width="9" height="7"></rect>
      <rect x="122" y="56" width="9" height="7"></rect>
    </g>
  </g>
  <text x="100" y="148" class="t-mono" font-size="10" text-anchor="middle" fill="#c0824a">2 048 bits</text>

  <text x="100" y="180" class="t-sans" font-size="11" text-anchor="middle" fill="#3d4248" font-weight="600">IrisCode</text>
  <text x="100" y="198" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">filtros 2D de Gabor</text>
  <text x="100" y="212" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">cuadratura compleja</text>
  <text x="100" y="226" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">→ vector binario</text>
</g>


<g transform="translate(980,200)">
  <rect x="0" y="0" width="200" height="240" fill="#fef6e3" stroke="#c0824a" stroke-width="1.4"></rect>
  <text x="14" y="26" class="t-mono" font-size="10" letter-spacing="1.5" fill="#c0824a">5 · MATCHING</text>
  
  <g transform="translate(20,55)">
    <line x1="0" y1="80" x2="160" y2="80" stroke="#1a1a1a" stroke-width="1"></line>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#1a1a1a" stroke-width="1"></line>
    <text x="-2" y="92" class="t-mono" font-size="8.5" text-anchor="end" fill="#6b7280">0</text>
    <text x="80" y="92" class="t-mono" font-size="8.5" text-anchor="middle" fill="#6b7280">0,33</text>
    <text x="160" y="92" class="t-mono" font-size="8.5" text-anchor="end" fill="#6b7280">0,5</text>
    
    <line x1="80" y1="0" x2="80" y2="80" stroke="#c0824a" stroke-width="1.4" stroke-dasharray="3 2"></line>
    
    <path d="M 0,80 Q 20,40 30,30 Q 40,40 60,80 Z" fill="#a8c2d8" opacity="0.7" stroke="#1a1a1a" stroke-width="0.6"></path>
    
    <path d="M 80,80 Q 100,45 120,40 Q 140,45 160,80 Z" fill="#e8b3a0" opacity="0.7" stroke="#1a1a1a" stroke-width="0.6"></path>
  </g>

  <text x="100" y="180" class="t-sans" font-size="11" text-anchor="middle" fill="#3d4248" font-weight="600">Distancia de Hamming</text>
  <text x="100" y="198" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">HD &lt; umbral → match</text>
  <text x="100" y="212" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">FAR ≈ 10⁻⁶</text>
  <text x="100" y="226" class="t-sans" font-size="10" text-anchor="middle" fill="#6b7280" font-style="italic">2 048 bits independ.</text>
</g>


<g stroke="#3d4248" stroke-width="1.4" fill="none" marker-end="url(#iris-arr)">
  <line x1="262" y1="320" x2="288" y2="320"></line>
  <line x1="492" y1="320" x2="518" y2="320"></line>
  <line x1="722" y1="320" x2="748" y2="320"></line>
  <line x1="952" y1="320" x2="978" y2="320"></line>
</g>


<g transform="translate(60,500)">
  <text x="0" y="0" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#2c3e50">PROPIEDADES DEL IRIS COMO IDENTIFICADOR BIOMÉTRICO</text>
  <line x1="0" y1="10" x2="1160" y2="10" stroke="#1a1a1a" stroke-width="0.8"></line>

  <g transform="translate(0,30)">
    <rect x="0" y="0" width="270" height="100" fill="#fafaf8" stroke="#d4d6da" stroke-width="1"></rect>
    <text x="16" y="24" class="t-serif" font-size="14" fill="#1a1a1a" font-weight="600">Estabilidad temporal</text>
    <text x="16" y="46" class="t-sans" font-size="11" fill="#3d4248">Estructura del estroma fija</text>
    <text x="16" y="62" class="t-sans" font-size="11" fill="#3d4248">desde el primer año de vida.</text>
    <text x="16" y="80" class="t-sans" font-size="11" fill="#6b7280" font-style="italic">Bhatt et al. (2025)</text>
  </g>
  <g transform="translate(295,30)">
    <rect x="0" y="0" width="270" height="100" fill="#fafaf8" stroke="#d4d6da" stroke-width="1"></rect>
    <text x="16" y="24" class="t-serif" font-size="14" fill="#1a1a1a" font-weight="600">Unicidad estadística</text>
    <text x="16" y="46" class="t-sans" font-size="11" fill="#3d4248">Probabilidad de colisión entre</text>
    <text x="16" y="62" class="t-sans" font-size="11" fill="#3d4248">dos iris distintos ≈ 10⁻⁷².</text>
    <text x="16" y="80" class="t-sans" font-size="11" fill="#6b7280" font-style="italic">Daugman (2004)</text>
  </g>
  <g transform="translate(590,30)">
    <rect x="0" y="0" width="270" height="100" fill="#fafaf8" stroke="#d4d6da" stroke-width="1"></rect>
    <text x="16" y="24" class="t-serif" font-size="14" fill="#1a1a1a" font-weight="600">Captura sin contacto</text>
    <text x="16" y="46" class="t-sans" font-size="11" fill="#3d4248">Adquisición a 0,3–1,0 m de</text>
    <text x="16" y="62" class="t-sans" font-size="11" fill="#3d4248">distancia con iluminación NIR.</text>
    <text x="16" y="80" class="t-sans" font-size="11" fill="#6b7280" font-style="italic">Bhatt et al. (2025)</text>
  </g>
  <g transform="translate(885,30)">
    <rect x="0" y="0" width="270" height="100" fill="#f8ecda" stroke="#c0824a" stroke-width="1.4"></rect>
    <text x="16" y="24" class="t-serif" font-size="14" fill="#1a1a1a" font-weight="600">Irrevocabilidad</text>
    <text x="16" y="46" class="t-sans" font-size="11" fill="#3d4248">A diferencia de claves o</text>
    <text x="16" y="62" class="t-sans" font-size="11" fill="#3d4248">contraseñas, no es modificable.</text>
    <text x="16" y="80" class="t-sans" font-size="11" fill="#6b7280" font-style="italic">propiedad anatómica</text>
  </g>
</g>

<line x1="60" y1="730" x2="1220" y2="730" stroke="#ececee" stroke-width="1"></line>
<text x="60" y="752" class="t-mono" font-size="10" fill="#6b7280">Adaptado del paradigma de Daugman, J. (2004). How iris recognition works. IEEE Transactions on Circuits and Systems for Video Technology, 14(1), 21–30. Revisión: Bhatt, Bhatt &amp; Bhatt (2025), Egypt. J. Forensic Sci. 15, 12.</text>
