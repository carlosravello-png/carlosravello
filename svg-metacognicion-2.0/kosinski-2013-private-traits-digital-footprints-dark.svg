<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" viewBox="0 0 1280 820" role="img">
<title>Atributos personales predecibles desde la huella digital (Kosinski et al., 2013) / Private traits predictable from digital footprints (Kosinski et al., 2013)</title>
<desc>Visualisation of the results published by Kosinski, Stillwell and Graepel in 2013 (PNAS 110(15): 5802–5805) on the predictability of private personal attributes from Facebook Likes, based on a study of 58,466 volunteers. Diagram by Carlos Eduardo Ravello Joo.</desc>

    <rect width="1280" height="820" fill="#060606"></rect>

    <text x="60" y="62" class="t-mono" font-size="11" letter-spacing="2" fill="#b8976a">FIG. 3 · KOSINSKI, STILLWELL &amp; GRAEPEL (2013)</text>
    <line x1="60" y1="74" x2="1220" y2="74" stroke="#1e1e1e" stroke-width="1"></line>
    <text x="60" y="112" class="t-serif" font-size="26" fill="#cecece">
      Atributos personales predecibles desde la huella digital
    </text>
    <text x="60" y="138" class="t-sans" font-size="13" fill="#5e5e66">
      Resultados del estudio PNAS con N = 58 466 voluntarios y 170 Me-gusta de Facebook por persona
    </text>

    
    <text x="60" y="190" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#cecece">
      A · ATRIBUTOS DICOTÓMICOS · AUC
    </text>
    <line x1="60" y1="200" x2="610" y2="200" stroke="#282828" stroke-width="1"></line>

    
    
    
    <line x1="430" y1="220" x2="430" y2="612" stroke="#2e2e38" stroke-width="0.8" stroke-dasharray="3 3"></line>
    <text x="430" y="635" class="t-mono" font-size="9.5" text-anchor="middle" fill="#5e5e66">0.50</text>
    <line x1="580" y1="220" x2="580" y2="612" stroke="#1e1e1e" stroke-width="0.6"></line>
    <text x="580" y="635" class="t-mono" font-size="9.5" text-anchor="middle" fill="#5e5e66">1.00</text>
    <text x="280" y="635" class="t-mono" font-size="9.5" text-anchor="middle" fill="#5e5e66">0</text>
    <text x="370" y="649" class="t-sans" font-size="9.5" text-anchor="middle" fill="#484850" font-style="italic">
      (azar)
    </text>

    
    
    
    <g>
      <text x="270" y="232" class="t-sans" font-size="12" text-anchor="end" fill="#cecece">
        Afroam. vs caucásico
      </text>
      <rect x="280" y="222" width="150" height="14" fill="#2d2d2d"></rect>
      <rect x="430" y="222" width="135" height="14" fill="#cecece"></rect>
      <text x="572" y="232" class="t-mono" font-size="10.5" fill="#cecece">0.95</text>
    </g>
    <g>
      <text x="270" y="268" class="t-sans" font-size="12" text-anchor="end" fill="#cecece">
