    <text x="680" y="558" class="t-sans" font-size="11" fill="#8a8a8a" font-style="italic">
      Las correlaciones reportadas para los Cinco Grandes
    </text>
    <text x="680" y="575" class="t-sans" font-size="11" fill="#8a8a8a" font-style="italic">
      resultan comparables a las obtenidas con cuestionarios
    </text>
    <text x="680" y="592" class="t-sans" font-size="11" fill="#8a8a8a" font-style="italic">
      estándar de autorreporte de personalidad.
    </text>

    
    <rect x="60" y="680" width="1160" height="68" fill="#110d04" stroke="#b8976a" stroke-width="1"></rect>
    <text x="84" y="710" class="t-serif" font-size="14" fill="#cecece" font-style="italic">
      «Los registros digitales de comportamiento humano fácilmente accesibles pueden ser usados para predecir
    </text>
    <text x="84" y="730" class="t-serif" font-size="14" fill="#cecece" font-style="italic">
      automática y exactamente un amplio rango de atributos personales altamente sensibles.»
    </text>

    <line x1="60" y1="764" x2="1220" y2="764" stroke="#181818" stroke-width="1"></line>
