    <text x="280" y="595" class="t-sans" font-size="10" fill="#5e5e66" font-style="italic">
      AUC = área bajo la curva ROC; 0.5 = azar, 1.0 = predicción perfecta
    </text>

    
    <line x1="650" y1="190" x2="650" y2="612" stroke="#1e1e1e" stroke-width="0.8"></line>

    
    <text x="680" y="190" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#cecece">
      B · GRANDES CINCO · correlación de Pearson
    </text>
    <line x1="680" y1="200" x2="1220" y2="200" stroke="#282828" stroke-width="1"></line>

    
