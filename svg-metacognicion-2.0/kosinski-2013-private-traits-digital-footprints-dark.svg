    <line x1="1150" y1="220" x2="1150" y2="490" stroke="#1e1e1e" stroke-width="0.6"></line>
    <text x="900" y="510" class="t-mono" font-size="9.5" text-anchor="middle" fill="#5e5e66">0</text>
    <text x="1150" y="510" class="t-mono" font-size="9.5" text-anchor="middle" fill="#5e5e66">0.50</text>

    
    <g>
      <text x="890" y="246" class="t-sans" font-size="12" text-anchor="end" fill="#cecece">
