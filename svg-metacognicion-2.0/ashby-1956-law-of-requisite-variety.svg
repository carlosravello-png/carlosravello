    <rect width="1280" height="760" fill="#ffffff"></rect>

    <text x="60" y="62" class="t-mono" font-size="11" letter-spacing="2" fill="#c0824a">FIG. 4 · ASHBY (1956)</text>
    <line x1="60" y1="74" x2="1220" y2="74" stroke="#d4d6da" stroke-width="1"></line>
    <text x="60" y="112" class="t-serif" font-size="26" fill="#1a1a1a">
      Ley de Variedad Requerida
    </text>
    <text x="60" y="138" class="t-sans" font-size="13" fill="#6b7280">
      «Sólo la variedad puede absorber variedad» — un principio fundacional de la cibernética
    </text>

    
    
    <rect x="100" y="320" width="180" height="100" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"></rect>
    <text x="190" y="358" class="t-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="600">D</text>
    <text x="190" y="382" class="t-sans" font-size="12" text-anchor="middle" fill="#3d4248">
      Perturbación
    </text>
    <text x="190" y="402" class="t-sans" font-size="10.5" text-anchor="middle" fill="#6b7280" font-style="italic">
      fuente de variedad
    </text>

    
    <rect x="540" y="320" width="200" height="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></rect>
    <text x="640" y="358" class="t-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="600">T</text>
    <text x="640" y="382" class="t-sans" font-size="12" text-anchor="middle" fill="#3d4248">
      Sistema objetivo
    </text>
    <text x="640" y="402" class="t-sans" font-size="10.5" text-anchor="middle" fill="#6b7280" font-style="italic">
      opera bajo influencia D y R
    </text>

    
    <rect x="1000" y="320" width="180" height="100" fill="#fef6e3" stroke="#c0824a" stroke-width="1.4"></rect>
    <text x="1090" y="358" class="t-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="600">E</text>
    <text x="1090" y="382" class="t-sans" font-size="12" text-anchor="middle" fill="#3d4248">
      Variables esenciales
    </text>
    <text x="1090" y="402" class="t-sans" font-size="10.5" text-anchor="middle" fill="#6b7280" font-style="italic">
      resultado dentro de límites
    </text>

    
    <rect x="540" y="540" width="200" height="100" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"></rect>
    <text x="640" y="578" class="t-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="600">R</text>
    <text x="640" y="602" class="t-sans" font-size="12" text-anchor="middle" fill="#1a1a1a">
      Regulador
    </text>
    <text x="640" y="622" class="t-sans" font-size="10.5" text-anchor="middle" fill="#6b7280" font-style="italic">
      acopla variedad a la perturbación
    </text>

    
    <line x1="280" y1="370" x2="540" y2="370" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#f4-arrow)"></line>
    <line x1="740" y1="370" x2="1000" y2="370" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#f4-arrow)"></line>
    
    <path d="M 540 570 Q 360 530 240 420" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f4-arrow)"></path>
    <text x="370" y="500" class="t-sans" font-size="11" text-anchor="middle" fill="#1a1a1a" font-style="italic">
      (percibe perturbación)
    </text>
    
    <line x1="640" y1="540" x2="640" y2="420" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#f4-arrow)"></line>
    <text x="660" y="486" class="t-sans" font-size="11" fill="#1a1a1a" font-style="italic">
      (actúa)
    </text>

    
    <text x="410" y="358" class="t-mono" font-size="10" text-anchor="middle" fill="#6b7280">
      variedad V(D)
    </text>
    <text x="870" y="358" class="t-mono" font-size="10" text-anchor="middle" fill="#6b7280">
      resultado
    </text>

    
    <rect x="200" y="200" width="880" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="0"></rect>
    <text x="640" y="226" class="t-mono" font-size="10.5" letter-spacing="1.6" text-anchor="middle" fill="#c0824a">
      LEY DE VARIEDAD REQUERIDA
    </text>
    <text x="640" y="252" class="t-serif" font-size="22" text-anchor="middle" fill="#1a1a1a">
      V(R) ≥ V(D) <tspan font-style="italic" font-size="14" fill="#6b7280">  →  V(E) bounded</tspan>
    </text>

    
    <text x="640" y="690" class="t-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-style="italic">
      «Sólo la variedad puede destruir variedad.»
    </text>
    <text x="640" y="712" class="t-sans" font-size="11.5" text-anchor="middle" fill="#6b7280">
      Ashby, W. R. (1956), §11/7
    </text>

