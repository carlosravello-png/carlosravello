<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" viewBox="0 0 1280 760" role="img">
<title>Ley de la Variedad Requerida de Ashby (1956) / Ashby&#39;s Law of Requisite Variety (1956)</title>
<desc>Diagram of the cybernetic principle formulated by W. Ross Ashby in An Introduction to Cybernetics (1956): only variety can absorb variety. A regulator can neutralise the variety of disturbances of a regulated system only if it possesses equal or greater variety. Diagram by Carlos Eduardo Ravello Joo.</desc>

