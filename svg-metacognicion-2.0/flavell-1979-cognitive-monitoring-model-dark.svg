<title>Modelo de monitorización cognitiva de Flavell (1979) / Flavell&#39;s model of cognitive monitoring (1979)</title>
<desc>Diagram of the model proposed by John H. Flavell in 1979 (American Psychologist 34(10): 906–911) describing the four classes of phenomena that interact in cognitive monitoring: metacognitive knowledge, metacognitive experiences, goals (tasks), and actions (strategies). Diagram by Carlos Eduardo Ravello Joo.</desc>

