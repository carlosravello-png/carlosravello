<title>Principio de Energía Libre de Friston (2010) / Friston&#39;s Free Energy Principle (2010)</title>
<desc>Diagram of the Free Energy Principle formulated by Karl Friston in 2010 (Nature Reviews Neuroscience 11(2): 127–138), describing the brain as a predictive machine that minimises variational free energy via two routes: perception (updating beliefs) and action (modifying the world to fit observations). Diagram by Carlos Eduardo Ravello Joo.</desc>

